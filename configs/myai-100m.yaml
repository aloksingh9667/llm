# MyAI-100M — Phase 1 small foundation (doc section 7 research config)
model_name: MyAI-100M
vocab_size: 32000
hidden_size: 768
num_layers: 12
num_heads: 12
num_kv_heads: 12
intermediate_size: 2048
max_sequence_length: 2048
normalization: rmsnorm
activation: swiglu
position_encoding: rope
rope_theta: 10000.0
tie_embeddings: true
dropout: 0.0

training:
  optimizer: adamw
  learning_rate: 3.0e-4
  weight_decay: 0.1
  warmup_steps: 2000
  max_steps: 50000
  batch_size_tokens: 131072
  grad_clip: 1.0
  seed: 1337
