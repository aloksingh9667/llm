# MyAI-20M — Phase 0 research model (pipeline proof, CPU debug)
model_name: MyAI-20M
vocab_size: 32000
hidden_size: 256
num_layers: 6
num_heads: 8
num_kv_heads: 8
intermediate_size: 688
max_sequence_length: 512
normalization: rmsnorm
activation: swiglu
position_encoding: rope
rope_theta: 10000.0
tie_embeddings: true
dropout: 0.0

training:
  optimizer: adamw
  learning_rate: 6.0e-4
  weight_decay: 0.1
  warmup_steps: 100
  max_steps: 1000
  batch_size_tokens: 16384
  grad_clip: 1.0
  seed: 1337
